[project]
name = "baji-ble"
version = "0.1.0"
description = "Cliente Python BLE para badges Legend Smartwatch (DG01) via path Baji NUS + AE00 RCSP probe"
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.21",
    "qix-ble",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
baji = "baji_ble.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["baji_ble*"]
exclude = ["tests*"]

[tool.uv.sources]
qix-ble = { path = "../qix-ble", editable = true }
